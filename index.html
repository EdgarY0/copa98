<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060e10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Copa 98</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#060e10;--panel:#12262b;--panel2:#1d363a;--line:#24413f;--lime:#d8f55a;--amber:#f2b33d;--green:#46c47a;--text:#e9efe9;--muted:#8fa3a0}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 32px;gap:14px;background:radial-gradient(1100px 520px at 50% -8%,#15312f 0%,var(--bg) 62%)}
.console{position:relative;width:100%;max-width:960px;background:var(--panel);border:1px solid var(--line);box-shadow:0 30px 90px #000c}
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;font:500 15px 'IBM Plex Mono',monospace;letter-spacing:.06em}
.brand{font:700 16px 'Space Grotesk',sans-serif;color:var(--lime)}
.steps{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
.pip{width:26px;height:6px;background:#2e4a4c;transition:background .3s}
.pip.on{background:var(--lime)}
.pipw{display:inline-flex;gap:5px}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
.chip{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.05em;padding:5px 8px;background:#1d363a;color:#cfd8d4;border:1px solid #2c4a4a;cursor:pointer}
.chip.done{color:var(--lime)}
.chip.cur{background:var(--lime);color:#12262b;border-color:var(--lime)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.arr{color:var(--muted);font:400 11px 'IBM Plex Mono',monospace}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.diff{color:var(--amber)}
.clock{color:var(--lime);min-width:64px;text-align:right}
.clock.warn{color:var(--amber);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.stage{position:relative;line-height:0;overflow:hidden;background:#296a50}
canvas{width:100%;height:auto;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#0000001f 2px 3px);box-shadow:inset 0 0 90px #000b}
.bottom{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap;min-height:52px}
.status{font:500 13px 'IBM Plex Mono',monospace;letter-spacing:.05em;padding:7px 11px;background:#1f4a3f;color:var(--lime);transition:background .3s,color .3s;white-space:nowrap}
.status.warn{background:#4a3a17;color:var(--amber)}
.status.flash{background:var(--green);color:var(--panel)}
.next{font:400 13px 'IBM Plex Mono',monospace;color:#d5ddd9;flex:1;min-width:220px}
.keys{font:400 11px 'IBM Plex Mono',monospace;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
kbd{font:500 11px 'IBM Plex Mono',monospace;border:1px solid #3a5658;padding:1px 5px;color:#fff;background:#0f2023}
#toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;line-height:1.1;text-align:center;white-space:nowrap}
#toast span{display:inline-block;font:700 22px 'Space Grotesk',sans-serif;background:#12262bee;color:var(--lime);padding:10px 18px;border:1px solid #2c4a4a;animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
#toast span.warn{color:var(--amber);border-color:#6a5220}
#toast span.ok{background:var(--green);color:var(--panel);border-color:var(--green)}
#toast span.big{font-size:64px;background:none;border:0;color:var(--lime);text-shadow:0 4px 0 #12262b,0 0 30px #d8f55a88}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#coach{position:absolute;left:14px;top:14px;max-width:340px;line-height:1.4;background:#12262bf0;border-left:3px solid var(--lime);padding:12px 14px;font:400 13px 'IBM Plex Mono',monospace;color:#e6ece8}
#coach:empty{display:none}
#coach b{color:var(--lime);font-weight:500}
#coach .t{font:600 18px 'Space Grotesk',sans-serif;color:#fff;margin:4px 0 6px}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#ov:empty{display:none}
.back{position:absolute;inset:0;background:#06100fc0}
.card{position:relative;background:var(--panel);border:1px solid #2c4a4a;width:100%;max-width:480px;max-height:calc(100% - 8px);overflow:auto;padding:24px;animation:in .22s cubic-bezier(.2,.8,.2,1);box-shadow:0 20px 60px #000a}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.tag{font:500 13px 'IBM Plex Mono',monospace;color:var(--lime);letter-spacing:.05em}
.tag.amber{color:var(--amber)}
.h1{font:700 72px/1 'Space Grotesk',sans-serif;margin-top:16px;color:#fff}
.h2{font:700 32px/1.1 'Space Grotesk',sans-serif;margin-top:12px;color:#fff}
.lead{font:500 16px 'IBM Plex Mono',monospace;letter-spacing:.08em;margin-top:10px}
.mono{font:400 13px 'IBM Plex Mono',monospace;color:#d5ddd9}
.box{background:var(--panel2);padding:16px;margin-top:14px}
.box .big{font:600 24px 'Space Grotesk',sans-serif;margin:6px 0;color:#fff}
.box p{color:#dfe7e3;font-size:15px;line-height:1.45}
.win{background:#24493f}
.win .big{font:700 32px 'Space Grotesk',sans-serif;color:var(--lime)}
.btn{display:flex;gap:26px;align-items:center;width:100%;background:var(--lime);color:#12262b;border:0;font:500 16px 'IBM Plex Mono',monospace;letter-spacing:.06em;padding:13px 18px;cursor:pointer;margin-top:16px;text-align:left;transition:background .2s,box-shadow .2s}
.btn:hover{background:#e6fd84}
.btn.lit{background:#f6ffb0;box-shadow:0 0 0 3px #f6ffb055,0 0 30px #d8f55aaa}
.link{background:none;border:0;color:var(--muted);font:400 12px 'IBM Plex Mono',monospace;margin-top:10px;cursor:pointer;text-decoration:underline}
.load{height:3px;background:#2e4a4c;margin-top:10px;overflow:hidden}
.load i{display:block;height:100%;width:0;background:var(--lime);transition:width .55s linear}
.badge{display:inline-block;margin-top:12px;border:1px solid var(--lime);color:var(--lime);font:500 12px 'IBM Plex Mono',monospace;padding:4px 8px;letter-spacing:.05em}
.blink{animation:blink 1s steps(2) infinite}
.list li{list-style:none;font:400 13px 'IBM Plex Mono',monospace;color:#dfe7e3;padding:4px 0}
.list li b{color:var(--lime);display:inline-block;min-width:110px;font-weight:500}
.story{width:100%;max-width:960px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font:400 12px 'IBM Plex Mono',monospace;color:var(--muted)}
.sn{background:var(--lime);color:#12262b;font:500 16px 'IBM Plex Mono',monospace;padding:4px 8px}
.st{font:600 20px 'Space Grotesk',sans-serif;color:#fff}
.path{margin-left:auto;letter-spacing:.04em}
.path b{background:var(--lime);color:#12262b;padding:0 3px;font-weight:500}
.notes{width:100%;max-width:960px;display:grid;grid-template-columns:110px 1fr;gap:6px 16px;border-top:1px solid var(--line);padding-top:12px;font-size:14px;color:#cfd8d4}
.notes[hidden]{display:none}
.notes .k{font:400 11px 'IBM Plex Mono',monospace;color:var(--muted);padding-top:3px}
.notes .c{grid-column:1/-1;color:var(--muted);font-size:13px}
.notes .c b{color:var(--lime);font:500 12px 'IBM Plex Mono',monospace;margin-left:10px}
/* ===== controles de toque ===== */
.touch{display:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.joy{position:relative;width:136px;height:136px;border-radius:50%;background:radial-gradient(circle,#1d363acc 0 55%,#12262bcc 56%);border:2px solid #2c4a4a;touch-action:none}
.joy .knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 5px #d8f55a33,0 6px 14px #0008;transition:transform .12s}
.joy.on .knob{transition:none}
.touch button{background:#12262bd9;border:2px solid #2c4a4a;color:#fff;font:600 30px 'IBM Plex Mono',monospace;touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
.touch button.on{background:var(--lime);color:#12262b;border-color:var(--lime);transform:scale(.94)}
.acts{display:grid;grid-template-columns:auto auto;grid-template-areas:"sel sta" "sq x";gap:14px 16px;align-items:center;justify-items:center}
.acts .big{width:78px;height:78px;border-radius:50%}
.acts .bsq{grid-area:sq;transform:translateY(-14px)}
.acts .bsq.on{transform:translateY(-14px) scale(.94)}
.acts .bx{grid-area:x;transform:translateY(18px)}
.acts .bx.on{transform:translateY(18px) scale(.94)}
.acts .sm{height:30px;border-radius:15px;font-size:11px;font-weight:500;padding:0 12px;letter-spacing:.05em}
.acts .big{position:relative}
.acts .big::after{content:attr(data-cap);position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:4px;font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#a9bdb8;white-space:nowrap}
#narr{position:absolute;left:50%;top:8px;transform:translateX(-50%);max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2;font:500 12px 'IBM Plex Mono',monospace;color:#fff;background:#12262be6;border-left:3px solid var(--lime);padding:5px 10px;opacity:0;transition:opacity .25s;pointer-events:none}
#narr.on{opacity:1}
body.mobile #narr{font-size:10px;padding:3px 8px;top:4px}
.ptip{display:none;font:400 11px 'IBM Plex Mono',monospace;color:var(--muted);text-align:center;max-width:110px;line-height:1.4}
/* ===== layout celular (ativado pelo JS conforme resolução/toque) ===== */
body.mobile{padding:0;gap:0;height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;background:var(--bg)}
body.mobile .story,body.mobile .notes,body.mobile .keys,body.mobile .brand{display:none!important}
body.mobile .console{max-width:none;border:0;box-shadow:none;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
body.mobile .hud{padding:6px 12px;font-size:12px}
body.mobile .steps{font-size:10px}
body.mobile .pip{width:18px}
body.mobile .bottom{padding:6px 12px;gap:8px;min-height:0;flex-wrap:nowrap}
body.mobile .status{font-size:11px;padding:4px 8px}
body.mobile .next{font-size:11px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.mobile #ov{position:fixed;z-index:20;padding:12px}
body.mobile .card{max-height:calc(100dvh - 24px);padding:18px;touch-action:pan-y}
body.mobile #coach{max-width:260px;font-size:11px;left:8px;top:8px;padding:8px 10px}
body.mobile #coach .t{font-size:14px}
/* deitado: campo em tela cheia, controles por cima */
body.mobile.land .console{height:100dvh}
body.mobile.land .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#060e10}
body.mobile.land .touch{display:block;position:fixed;inset:0;pointer-events:none;z-index:5}
body.mobile.land .touch>*{pointer-events:auto;position:absolute}
body.mobile.land .joy{left:calc(14px + env(safe-area-inset-left));bottom:44px;width:clamp(88px,28vh,112px);height:clamp(88px,28vh,112px)}
body.mobile.land .joy .knob{width:clamp(38px,12vh,48px);height:clamp(38px,12vh,48px);margin:calc(clamp(38px,12vh,48px)/-2) 0 0 calc(clamp(38px,12vh,48px)/-2)}
body.mobile.land .acts{right:calc(14px + env(safe-area-inset-right));bottom:50px;gap:8px 10px}
body.mobile.land .acts .big{width:clamp(48px,15vh,58px);height:clamp(48px,15vh,58px);font-size:22px}
body.mobile.land .acts .sm{height:24px;font-size:10px;padding:0 9px}
body.mobile.land .acts .bsq,body.mobile.land .acts .bsq.on{transform:translateY(-8px)}
body.mobile.land .acts .bx,body.mobile.land .acts .bx.on{transform:translateY(10px)}
body.mobile.land .bottom{padding-left:calc(150px + env(safe-area-inset-left));padding-right:calc(170px + env(safe-area-inset-right))}
.joy,.acts{flex:none}
body.mobile.land .h1{font-size:44px;margin-top:8px}
body.mobile.land .h2{font-size:24px;margin-top:6px}
body.mobile.land .lead{font-size:13px}
body.mobile.land .box{padding:12px;margin-top:10px}
body.mobile.land .box .big{font-size:19px}
body.mobile.land .btn{padding:10px 14px;margin-top:10px;font-size:14px}
body.mobile.land .card{max-width:560px}
/* em pé: campo em cima, controles embaixo */
body.mobile.port .console{flex:none}
body.mobile.port .bottom{flex-wrap:wrap}
body.mobile.port .next{white-space:normal}
body.mobile.port .touch{display:flex;flex:1;width:100%;flex-wrap:wrap;justify-content:space-between;align-content:center;align-items:center;row-gap:18px;padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:#0a1517}
body.mobile.port .ptip{display:block;order:-1;flex-basis:100%;max-width:none;font-size:10px}
body.mobile.port .joy{width:clamp(92px,28vw,120px);height:clamp(92px,28vw,120px)}
body.mobile.port .joy .knob{width:clamp(40px,12vw,50px);height:clamp(40px,12vw,50px);margin:calc(clamp(40px,12vw,50px)/-2) 0 0 calc(clamp(40px,12vw,50px)/-2)}
body.mobile.port .acts{gap:10px 12px}
body.mobile.port .acts .big{width:clamp(52px,15vw,64px);height:clamp(52px,15vw,64px);font-size:clamp(20px,6vw,26px)}
body.mobile.port .acts .sm{height:26px;font-size:10px;padding:0 10px}
body.mobile.port .acts .bsq,body.mobile.port .acts .bsq.on{transform:translateY(-8px)}
body.mobile.port .acts .bx,body.mobile.port .acts .bx.on{transform:translateY(10px)}
body.mobile.port #coach{max-width:62%;font-size:10px;padding:6px 8px}
body.mobile.port #coach .t{font-size:12px;margin:2px 0 3px}
@media (max-width:760px){#ov{position:fixed}.h1{font-size:52px}.h2{font-size:26px}.hud{font-size:13px;padding:8px 10px}.brand{display:none}.bottom{padding:8px 10px}.keys{display:none}#coach{max-width:240px;font-size:11px;left:8px;top:8px;padding:8px 10px}#coach .t{font-size:14px}#toast span{font-size:16px}#toast span.big{font-size:40px}.path{margin-left:0}}
</style>
</head>
<body>
<div class="console" id="console">
  <div class="hud">
    <span class="brand">COPA 98</span>
    <span id="score">BRA 1 : 1 NOR</span>
    <span class="steps">ETAPAS <span id="pips" class="pipw"></span> <span id="stxt">0/2</span></span>
    <span class="clock" id="clock">89:00</span>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" width="480" height="270"></canvas>
    <div class="scan"></div>
    <div id="coach"></div>
    <div id="narr"></div>
    <div id="toast"></div>
  </div>
  <div class="bottom">
    <span class="status" id="status">FUTEBOL RETRÔ / 1998</span>
    <span class="next" id="next"></span>
    <span class="keys"><span><kbd>X</kbd> × toque</span><span><kbd>Z</kbd> □ chute (segure)</span><span><kbd>H</kbd> SELECT ajuda</span><span><kbd>P</kbd> START pausa</span><span><kbd>M</kbd> som</span><span><kbd>I</kbd> notas IHM</span></span>
  </div>
  <div id="ov"></div>
</div>

<div class="touch" id="touch">
  <div class="joy" id="joy" aria-label="Analógico: mover jogador"><div class="knob" id="knob"></div></div>
  <div class="ptip">↻ gire o celular para jogar em tela cheia</div>
  <div class="acts">
    <button class="sm" style="grid-area:sel" data-b="SELECT">SELECT</button>
    <button class="sm" style="grid-area:sta" data-b="START">START</button>
    <button class="big bsq" data-b="SQ" data-cap="CHUTE" aria-label="Quadrado: segure para mirar, solte para chutar">□</button>
    <button class="big bx" data-b="X" data-cap="TOQUE" aria-label="Xis: confirmar e tocar a bola">×</button>
  </div>
</div>

<div class="story">
  <span class="sn" id="sn">01</span><span class="st" id="stt">Abertura</span><span id="ssub">INÍCIO / CONVITE PARA JOGAR</span>
  <span class="path" id="path"></span>
</div>
<div class="notes" id="notes" hidden></div>

<script>
/* ================= DADOS DO STORYBOARD ================= */
const META=[
 {n:'01',t:'Abertura',s:'INÍCIO / CONVITE PARA JOGAR',na:'A final está empatada. Você entra para decidir o último lance.',ac:'Pressionar × em “Iniciar jogo”.',fb:'Botão acende + “Carregando...” em 200 ms; abre a missão.',c:'Condução • Controle explícito',x:'PRÓXIMO → 02 / MISSÃO'},
 {n:'02',t:'Missão',s:'INÍCIO / OBJETIVO ANTES DA AÇÃO',na:'O técnico confia em você: faça um passe e marque o gol.',ac:'Ler o objetivo e abrir o tutorial.',fb:'Placar, tempo e etapas 0/2 visíveis antes de começar.',c:'Condução • Carga de trabalho',x:'PRÓXIMO → 03 / TUTORIAL'},
 {n:'03',t:'Tutorial',s:'INÍCIO / UMA AÇÃO POR VEZ',na:'Antes da final, você aprende o passe curto em um treino seguro.',ac:'Pressionar × faz o passe demonstrado. SELECT repete a ajuda sem penalidade.',fb:'A bola percorre a linha pontilhada (600 ms). Texto explica o comando.',c:'Adaptabilidade • Compatibilidade',x:'PRÓXIMO → 04 / JOGADA'},
 {n:'04',t:'Jogada',s:'MEIO / DO PASSE À FINALIZAÇÃO',na:'3 contra 3. O passe deu certo; agora é escolher entre tocar de novo ou finalizar.',ac:'× toca para quem você aponta. Segurar □ faz a mira correr; soltar chuta. START pausa; SELECT ajuda.',fb:'“Passe certo” + destaque verde (300 ms). Etapa salva antes do chute. Narrador comenta o lance.',c:'Condução • Feedback imediato',x:'DESVIO → 05 SE ERRAR / 06 SE MARCAR'},
 {n:'05',t:'Recuperação',s:'MEIO / ERRO SEM PERDER O PROGRESSO',na:'A bola foi para fora. O erro não encerra a história nem apaga o passe.',ac:'Selecionar “Desfazer chute e tentar”.',fb:'Aviso âmbar + rótulo do erro. Retorno de 200 ms ao checkpoint.',c:'Gestão de erros • Controle explícito',x:'RETORNO → 04 / MESMO PASSE E TEMPO'},
 {n:'06',t:'Encerramento',s:'FIM / MISSÃO CUMPRIDA',na:'Você marca o gol da vitória. O estreante vira o herói da final.',ac:'Confirmar para voltar ao menu. A conquista continua salva.',fb:'Replay do gol em câmera lenta, depois verde + “É campeão” + placar 2:1.',c:'Feedback • Consistência • Fechamento',x:'FIM → 01 / RESULTADO PRESERVADO'}
];
const IDX={menu:0,mission:1,tutorial:2,play:3,recover:4,end:5};
const REASON={fora:'CHUTE PARA FORA',defesa:'O GOLEIRO DEFENDEU',bloqueio:'CHUTE BLOQUEADO',desarme:'PERDEU A BOLA',interceptado:'PASSE INTERCEPTADO',tempo:'O TEMPO ACABOU'};
const TIP={fora:'A mira passa um pouco das traves. Solte □ quando ela estiver dentro do gol (verde).',
 defesa:'Chegue mais perto e solte com a mira no canto oposto ao goleiro.',
 bloqueio:'Saia do marcador antes de armar: chute com o caminho livre.',
 desarme:'O marcador dá o bote e fica parado se errar: mude de direção na hora e toque.',
 interceptado:'Aponte para quem está com a linha LIVRE (pontilhado verde) antes de tocar.',
 tempo:'O apito vem aos 90:00. Decida mais rápido.'};

/* ================= UTIL ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const unit=(x,y)=>{const l=Math.hypot(x,y)||1;return{x:x/l,y:y/l}};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(){try{return JSON.parse(localStorage.getItem('copa98')||'null')}catch(e){return null}},set(v){try{localStorage.setItem('copa98',JSON.stringify(v))}catch(e){}}};
const clockStr=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`;
const cache={};
let MOBILE=false,TOUCH=false;
/* no celular, troca "tecla Z / setas" por "botão □ / analógico" */
const tx=s=>!TOUCH?s:s.replace(/ ?\((tecla )?[XZ]\)/g,'').replace(/\(← ↑ → ↓\)/g,'(analógico)').replace(/← ↑ → ↓/g,'o analógico').replace(/ \(ou WASD\)| ou WASD/g,'');
function setH(id,html){if(cache[id]!==html){cache[id]=html;document.getElementById(id).innerHTML=tx(html)}}
function setC(id,c){const k=id+'_c';if(cache[k]!==c){cache[k]=c;document.getElementById(id).className=c}}

function moveToward(p,tx,ty,spd,dt){
 const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);
 if(d<.8){p.vx=p.vy=0;return}
 const s=Math.min(spd,d/dt);p.vx=dx/d*s;p.vy=dy/d*s;p.x+=p.vx*dt;p.y+=p.vy*dt;
 if(Math.abs(dx)>.5)p.face=Math.sign(dx);p.step+=dt*s/38;
}

  if(ball.x>=F.goal){shot.resolved=true;shot.cb(shot.on?'gol':'fora')}
 }

/* ================= REPLAY ================= */
function record(){
 if(replay||phase==='over')return;
 if(phase==='goal'&&rec.length-rec.goalI>36)return;
 rec.push({t:tt,E:Object.fromEntries(Object.entries(E).map(([k,p])=>[k,{...p}])),ball:{...ball}});
 if(phase!=='goal'&&rec.length>200)rec.shift();
}
function startReplay(){
 if(mode!=='play')return;
 const gi=rec.goalI??rec.length,fr=rec.slice(Math.max(0,gi-100),Math.min(rec.length,gi+30));
 if(fr.length<10){go('end');return}
 replay={fr,i:0,t:0,hold:0};narr('● REPLAY · × pula',9000);
}
function tickReplay(dt){
 const r=replay;r.t+=dt*.45;const T=r.fr[0].t+r.t;
 while(r.i<r.fr.length-1&&r.fr[r.i+1].t<=T)r.i++;
 const f=r.fr[r.i];E=f.E;ball=f.ball;
 if(r.i>=r.fr.length-1){r.hold+=dt;if(r.hold>.6)endReplay()}
}
function endReplay(){if(!replay)return;replay=null;go('end')}

/* ================= UPDATE ================= */
function update(dt){
 pollPad();
 fx.shake=Math.max(0,fx.shake-dt);fx.crowd=Math.max(0,fx.crowd-dt);fx.flash=Math.max(0,fx.flash-dt);fx.rew=Math.max(0,fx.rew-dt);fx.net=Math.max(0,fx.net-dt);flashT=Math.max(0,flashT-dt);
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=60*dt;p.vx*=.99;p.life-=dt;if(p.life<=0)parts.splice(i,1)}
 if(mode==='end'&&endT>0){endT-=dt;if(!RM)for(let i=0;i<3;i++)parts.push({x:Math.random()*W,y:-4,vx:(Math.random()-.5)*30,vy:40+Math.random()*60,c:['#d8f55a','#f5c84c','#46c47a','#fff'][Math.floor(Math.random()*4)],life:2.5})}
 if(overlay)return;
 if(replay){tickReplay(dt);return}
 if(mode==='play')updatePlay(dt);
 else if(mode==='tutorial')updateTut(dt);
 else if(mode==='menu'||mode==='mission')updateAttract(dt);
}
const LIVE={open:1,flight:1,lost:1,shot:1,loose:1};
function updatePlay(dt){
 const l=L();
 if(LIVE[phase]){
  clock+=dt*CLOCK_RATE;
  if(Math.floor(clock)!==Math.floor(lastSec)){lastSec=clock;if(clock>=5390&&clock<5400)SFX.tick()}
  if(clock>=5385&&!warned){warned=true;narr('Últimos segundos! É agora ou nunca!')}
  if(clock>=5400){clock=5400;if(phase!=='shot'&&phase!=='loose'){fail('tempo');return}}
 }
 tt+=dt;if(grace>0)grace-=dt;
 for(const k of DEF())if(E[k].safe>0)E[k].safe-=dt;
 if(phase==='open'){
  const c=E[ctrl];
  if(c.lag>0){c.lag-=dt;stopP(c)}else moveCtrl(c,dt,charging?AIM_SPEED:SPEED);
  aimTick(dt);
  tgt=pickTgt();lane=tgt?laneFree(tgt):false;
  supportAI(dt);defAI(dt);
  if(phase==='open'){gkTrack(dt);gkSmother(c)}
 }else if(phase==='flight'){
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;pass.dist+=pass.sp*dt;
  const r=E[pass.to];moveToward(r,pass.tx,pass.ty,80,dt);
  moveCtrl(E[ctrl],dt,SPEED);          // toca e sai: quem passou continua se movendo
  supportAI(dt,pass.to);flightDef(dt);gkTrack(dt);
  for(const k of DEF())if(E[k].st!=='stun'&&dist(ball,E[k])<7){lose(k,'interceptado');break}
  if(phase==='flight'&&(dist(ball,r)<8||pass.dist>=pass.len))receive();
 }else if(phase==='lost'){
  lostT-=dt;lostAI(dt);
  if(phase==='lost'&&lostT<=0){narr('A zaga afastou o perigo.');fail(lostR)}
 }else if(phase==='shot'){
  ballFree(dt);
  if(phase==='shot'&&shot&&!shot.resolved&&E.gk){
   const gk=E.gk;shot.react-=dt;
   if(shot.react<=0&&ball.vx>0&&!shot.checked){const py=ball.y+ball.vy*(gk.x-ball.x)/ball.vx,ty=clamp(py,F.mT-5,F.mB+5);if(Math.abs(ty-gk.y)>3)gk.dive=Math.sign(ty-gk.y);moveToward(gk,gk.x,ty,l.gkS,dt);gk.face=-1}
  }
  for(const k of DEF()){const d=E[k];if(d.st==='stun'){stunTick(d,dt);continue}d.st='track';moveToward(d,ball.x,ball.y,20,dt)}
  for(const k of MATES())if(k!==ctrl)moveToward(E[k],400,E[k].y<135?112:158,50,dt);
 }else if(phase==='loose'){
  ballFree(dt);looseT-=dt;if(looseImm>0)looseImm-=dt;looseAI(dt);
  if(phase==='loose'&&looseT<=0){narr('A zaga afastou o perigo.');fail(looseR)}
 }else{
  if(ball.owner===null)ballFree(dt);
  if(phase==='goal'){const sc=E[ctrl];moveToward(sc,sc.x+20*Math.sin(tt*6),sc.y-6*Math.abs(Math.sin(tt*8)),60,dt);for(const k of MATES())if(k!==ctrl)moveToward(E[k],sc.x-12,sc.y+8,70,dt)}
 }
 holdBall();record();
}

/* ----- IA: companheiros buscam espaço longe dos marcadores ----- */
function supportAI(dt,skip){
 const c=E[ctrl],all=MATES().filter(k=>k!==ctrl).sort((a,b)=>E[a].y-E[b].y);
 for(const k of all){
  if(k===skip)continue;
  const p=E[k],up=all.length<2?c.y>F.cy:all[0]===k;
  let x=clamp(c.x+(up?72:52)+8*Math.sin(tt*.9+(up?0:2)),110,418),y=(up?78:194)+10*Math.sin(tt*.7+(up?1:3));
  for(const d of DEF()){const o=E[d],dd=Math.hypot(x-o.x,y-o.y);if(dd<36&&dd>0){x+=(x-o.x)/dd*(36-dd);y+=(y-o.y)/dd*(36-dd)}}
  moveToward(p,clamp(x,F.left+10,F.goal-14),clamp(y,F.top+12,F.bot-4),56,dt);
 }
}
/* ----- IA: defesa com papéis (pressão, marcação, cobertura) ----- */
function stunTick(d,dt){d.t-=dt;stopP(d);if(d.t<=0)d.st='track'}
function defAI(dt){
 const l=L(),c=E[ctrl],ds=DEF().sort((a,b)=>dist(E[a],c)-dist(E[b],c));
 const mates=MATES().filter(k=>k!==ctrl).sort((a,b)=>dist(E[a],G0)-dist(E[b],G0));
 let [a,b]=ds.slice(1);
 if(mates.length&&a&&b&&dist(E[b],E[mates[0]])<dist(E[a],E[mates[0]]))[a,b]=[b,a];
 pressAI(ds[0],c,dt);if(phase!=='open')return;
 if(a&&mates[0]){const d=E[a],m=E[mates[0]],k=.15+.35*l.read;   // marca o atacante mais perigoso, do lado da bola
  if(d.st==='stun')stunTick(d,dt);else{d.st='track';moveToward(d,m.x+(c.x-m.x)*k+10,m.y+(c.y-m.y)*k,l.mark,dt)}}
 if(b){const d=E[b];   // cobertura: entre a bola e o gol, fechando a outra linha de passe
  if(d.st==='stun')stunTick(d,dt);else{d.st='track';
   let x=c.x+(F.goal-c.x)*.42,y=c.y+(F.cy-c.y)*.42;const m=mates[1]&&E[mates[1]];
   if(m){x+=((c.x+m.x)/2-x)*l.read*.5;y+=((c.y+m.y)/2-y)*l.read*.5}
   moveToward(d,x,y,l.cover,dt)}}
 if(grace<=0)for(const k of DEF()){const d=E[k];if(d.st!=='stun'&&d.safe<=0&&dist(d,c)<7){lose(k,'desarme');return}}
}
function pressAI(k,c,dt){
 const d=E[k],l=L();
 if(d.st==='stun'){stunTick(d,dt);return}
 if(d.st==='lunge'){   // bote: rápido, mas se errar fica parado
  moveToward(d,d.lx,d.ly,l.press*2.1,dt);d.t-=dt;
  if(grace<=0&&dist(d,c)<8){lose(k,'desarme');return}
  if(d.t<=0||Math.hypot(d.x-d.lx,d.y-d.ly)<1.5){d.st='stun';d.t=l.stun;stopP(d);SFX.whiff();narr(pick(['Passou pelo marcador!','Que drible! Deixou o zagueiro no chão.','O bote foi em vão!']))}
  return}
 d.cd=Math.max(0,d.cd-dt);
 moveToward(d,c.x+c.vx*.3+6,c.y+c.vy*.3,l.press,dt);
 if(grace<=0&&d.cd<=0&&dist(d,c)<24){d.st='lunge';d.t=.32;d.lx=c.x+c.vx*.22;d.ly=c.y+c.vy*.22;d.cd=1.2}
}
function flightDef(dt){   // quem consegue chegar antes da bola corta a linha
 const l=L(),sp=l.cover*(.5+l.read);
 for(const k of DEF()){const d=E[k];
  if(d.st==='stun'){stunTick(d,dt);continue}
  d.st='track';
  const dx=pass.tx-ball.x,dy=pass.ty-ball.y,ll=dx*dx+dy*dy||1;
  const t=clamp(((d.x-ball.x)*dx+(d.y-ball.y)*dy)/ll,0,1),px=ball.x+dx*t,py=ball.y+dy*t;
  const ballT=t*Math.sqrt(ll)/pass.sp,need=Math.hypot(px-d.x,py-d.y)/sp;
  if(need<ballT+.15)moveToward(d,px,py,sp,dt);else stopP(d);
 }
}
function autoSwitch(){
 const c=E[ctrl];let best=ctrl,bd=dist(c,ball)-12;
 for(const k of MATES()){if(k===ctrl)continue;const dd=dist(E[k],ball);if(dd<bd){best=k;bd=dd}}
 if(best!==ctrl){ctrl=best;charging=false}
}
function lostAI(dt){
 const l=L(),dk=ball.owner,d=E[dk];
 autoSwitch();
 const c=E[ctrl];if(c.lag>0){c.lag-=dt;stopP(c)}else moveCtrl(c,dt,SPEED);
 if(d.st==='stun')stunTick(d,dt);else{   // quem roubou foge para o outro lado, longe de quem pressiona
  const nb=MATES().reduce((a,k)=>dist(E[k],d)<dist(E[a],d)?k:a);
  const away=Math.sign(d.y-E[nb].y)||1;
  moveToward(d,F.left+20,clamp(d.y+away*40,F.top+14,F.bot-4),l.carry,dt);d.face=-1;
 }
 const help=MATES().filter(k=>k!==ctrl).sort((a,b)=>dist(E[a],d)-dist(E[b],d));
 if(help[0])moveToward(E[help[0]],d.x-4,d.y,34,dt);
 if(help[1]){const p=E[help[1]];moveToward(p,clamp(d.x+50,120,400),p.y<F.cy?80:190,40,dt)}
 for(const k of DEF()){if(k===dk)continue;const o=E[k];if(o.st==='stun'){stunTick(o,dt);continue}o.st='track';moveToward(o,clamp(d.x+40,100,400),o.y,24,dt)}
 gkTrack(dt);
 if(d.safe<=0)for(const k of MATES())if(dist(E[k],d)<8){regain(k);return}
}
function looseAI(dt){
 const l=L();autoSwitch();
 moveCtrl(E[ctrl],dt,SPEED);
 for(const k of MATES())if(k!==ctrl)moveToward(E[k],ball.x-8,ball.y+(E[k].y<ball.y?-20:20),40,dt);
 for(const k of DEF()){const d=E[k];if(d.st==='stun'){stunTick(d,dt);continue}d.st='track';moveToward(d,ball.x,ball.y,l.cover*.9,dt)}
 const gk=E.gk;if(looseT<1.9)gk.dive=0;
 if(!gk.dive){if(ball.x>372)moveToward(gk,ball.x,ball.y,l.gkT*1.3,dt);else gkTrack(dt)}
 if(ball.z<5){
  for(const k of MATES())if(dist(E[k],ball)<7){ctrl=k;ball.owner=k;phase='open';grace=.7;E[k].dx=1;E[k].dy=0;SFX.ok();toast('REBOTE! É SUA','ok',900);narr('Pegou o rebote! Chuta!');return}
  if(looseImm<=0)for(const k of OPP())if(dist(E[k],ball)<7){ball.owner=k;narr(k==='gk'?'O goleiro ficou com a sobra.':'A zaga afastou o perigo.');fail(looseR);return}
 }
 if(ball.x<F.left||ball.x>F.goal||ball.y<F.top||ball.y>F.bot){narr('Bola pela linha de fundo.');fail(looseR)}
}
/* ----- goleiro: ângulo, saída do gol, mergulho e rebote ----- */
function gkTrack(dt){
 const gk=E.gk,l=L(),d=Math.hypot(ball.x-F.goal,ball.y-F.cy);
 const out=l.gkOut*clamp((160-d)/110,0,1);   // sai do gol quando o atacante chega perto
 moveToward(gk,F.goal-7-out,F.cy+clamp((ball.y-F.cy)*(.3+out/60),-15,15),l.gkT,dt);
 gk.dive=0;gk.face=-1;
}
function gkSmother(c){
 if(grace<=0&&dist(E.gk,c)<8){ball.owner='gk';narr('O goleiro saiu nos pés e ficou com ela!');fail('defesa')}
}
function updateAttract(dt){
 tt+=dt;
 moveToward(E.hero,90+30*Math.sin(tt*.5),160+20*Math.cos(tt*.7),30,dt);
 moveToward(E.mate,200+40*Math.sin(tt*.4),90+30*Math.sin(tt*.6),30,dt);
 moveToward(E.m2,160+30*Math.sin(tt*.6),215+10*Math.cos(tt*.5),28,dt);
 moveToward(E.d1,180+30*Math.cos(tt*.5),200+20*Math.sin(tt*.8),25,dt);
 moveToward(E.d2,150+20*Math.sin(tt*.9),130+30*Math.cos(tt*.4),25,dt);
 moveToward(E.d3,300+25*Math.cos(tt*.6),150+30*Math.sin(tt*.5),25,dt);
 moveToward(E.gk,F.goal-8,F.cy+12*Math.sin(tt*.8),20,dt);
 const k=(1-Math.cos(tt*1.4))/2,a=E.hero,b=E.mate;
 ball.x=a.x+6+(b.x-a.x-12)*k;ball.y=a.y+(b.y-a.y)*k;ball.z=Math.sin(k*Math.PI)*6;
}
function updateTut(dt){
 tt+=dt;const c=E[ctrl];
 if(tut.step<=1&&phase==='pass'){
  tut.moved+=moveCtrl(c,dt,SPEED);carry(c);E.mate.face=c.x<E.mate.x?-1:1;
  if(tut.step===0&&tut.moved>45){tut.step=1;SFX.ok()}
 }else if(phase==='flight'){
  pass.t+=dt;const k=Math.min(1,pass.t/.6),e=1-Math.pow(1-k,3);

  if(k>=1){ball.owner='mate';ctrl='mate';E.mate.dx=1;E.mate.dy=0;E.mate.face=1;phase='shoot';tut.step=2;SFX.ok();flashT=.3;toast('PASSE CERTO','ok',900)}
 }else if(phase==='shoot'){
  moveCtrl(c,dt,charging?AIM_SPEED:SPEED);carry(c);aimTick(dt);

}
function tutShot(r){

 else{phase='done';SFX.err();toast('PARA FORA · SEM PENALIDADE','warn',1100);
  later(()=>{if(mode!=='tutorial')return;const m=E.mate;m.x=Math.min(m.x,360);ball={x:m.x+6,y:m.y,z:0,vx:0,vy:0,vz:0,owner:'mate'};shot=null;phase='shoot'},1100)}

function down(k){

function onX(){

 const s=store.get()||{};
 switch(mode){
  case 'menu':busy=true;SFX.ui();if(MOBILE)goFull();$('#ov .btn').classList.add('lit');$('#lbl').textContent='CARREGANDO...';$('#ld').style.width='100%';later(()=>{busy=false;go('mission')},650);break;
  case 'mission':SFX.ui();go(s.tut?'play':'tutorial');break;
  case 'tutorial':
   if(tut.step===1&&phase==='pass'){pass={fx:ball.x,fy:ball.y,tx:E.mate.x-6,ty:E.mate.y,t:0};ball.owner=null;phase='flight';SFX.pass()}
   else if(tut.step===0){hint('Primeiro, mova o jogador com ← ↑ → ↓ ou WASD.')}
   else if(tut.step===3){go('play')}
   else if(tut.step===2){hint('Agora é o chute: segure □ (tecla Z).')}

   break;

 }

 if(mode==='play'&&phase==='open'){
  const f=L().passes-np;
  if(f<=0){aimStart();narr(pick(['Ele arma o chute...','Olha o chute...','Prepara a finalização...']),1500)}
  else hint(`Primeiro o toque: × (tecla X) passa para quem você aponta. ${f>1?`Faltam ${f}.`:'Falta 1.'}`);
  return}
 if(mode==='play'&&phase==='lost'){hint('Recupere a bola antes de chutar.');return}

 setH('pips',Array.from({length:N},(_,i)=>`<i class="pip${stp>i?' on':''}"></i>`).join(''));setH('stxt',stp+'/'+N);
 if(mode==='play'){
  if(replay){st='● REPLAY';cls+=' flash';nx='× ou □ pula o replay.'}
  else if(phase==='open'){
   if(charging){const on=aimOn();st=on?`MIRA NO GOL · ${shotKind()}`:'MIRA FORA DO GOL';if(!on)cls+=' warn';nx='Solte □ (Z) com a mira dentro das traves. Quanto mais segura, mais rápida ela fica.'}
   else if(np>=l.passes){st=`PASSE CERTO / ETAPAS ${step}/${N}`;nx='Próximo: segure <b style="color:var(--lime)">□ (tecla Z)</b> para mirar e solte para chutar. × ainda toca.'}
   else{st=lane?'LINHA DE PASSE: LIVRE ✓':'LINHA DE PASSE: BLOQUEADA ✕';if(!lane)cls+=' warn';
    nx=lane?`Próximo: <b style="color:var(--lime)">× (tecla X)</b> toca para o camisa ${SHIRT[tgt]}. Aponte (← ↑ → ↓) para escolher.`:'Linha bloqueada: aponte (← ↑ → ↓) para outro companheiro ou mova-se.'}}
  else if(phase==='flight'){st='PASSE...';nx='A bola está a caminho. Quem passou pode correr para a tabela.'}
  else if(phase==='lost'){st=`RECUPERE A BOLA · ${Math.ceil(lostT)}`;cls+=' warn';nx='Encoste no adversário com a bola para tomar de volta.'}

 }else if(mode==='tutorial'){
  st=['TREINO / MOVIMENTO','TREINO / TOQUE','TREINO / CHUTE','TREINO / CONCLUÍDO'][tut.step];
  nx=['Próximo: mover o jogador.','Próximo: tocar e ir para o chute.','Próximo: chutar para o gol vazio.','Próximo: entrar em campo.'][tut.step];

 else if(mode==='mission'){st=`${l.tag} / ${clockStr(l.start)}`;nx=(store.get()||{}).tut?'Próximo: entrar em campo. ← → trocam a fase.':'Próximo: ver o tutorial.'}
 else if(mode==='recover'){st=REASON[reason];cls+=' warn';nx='Próximo: voltar à chance de gol.'}
 else if(mode==='end'){st=lv===LAST?'APITO FINAL / RESULTADO SALVO':'CLASSIFICADO / RESULTADO SALVO';cls+=' flash';nx=lv===LAST?'Próximo: voltar ao início.':`Próximo: ${LEVELS[lv+1].nome}.`}
 if(flashT>0&&!replay)cls='status flash';
 if(overlay==='pause'){st='JOGO PAUSADO';cls='status warn'}
 setH('status',st);setC('status',cls);setH('next',nx);
}

 }
 // anel do controlado
 if(act&&c&&(phase==='open'||phase==='flight'||phase==='lost'||phase==='loose'||phase==='pass'||phase==='shoot')){
  g.strokeStyle='#d8f55a';g.lineWidth=1;g.beginPath();g.ellipse(Math.round(c.x)+.5,Math.round(c.y)+1.5,8,3,0,0,Math.PI*2);g.stroke();
  g.fillStyle='#d8f55a';const ty=Math.round(c.y)-21+Math.round(Math.sin(now/160));g.fillRect(c.x-2,ty,5,1);g.fillRect(c.x-1,ty+1,3,1);g.fillRect(c.x,ty+2,1,1);
 }
 const list=Object.values(E).map(p=>({y:p.y,f:()=>drawP(p)}));list.push({y:ball.y+.5,f:drawBall});
 list.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
 drawGoal(true);
 if(act&&mode==='play'){
  // companheiros livres pedem a bola
  if(phase==='open'&&!charging&&blink)for(const k of MATES()){if(k===ctrl||k===tgt)continue;const m=E[k];if(m.x>c.x-10&&laneFree(k)){g.fillStyle='#fff';g.fillRect(Math.round(m.x),Math.round(m.y)-23,1,4);g.fillRect(Math.round(m.x),Math.round(m.y)-18,1,1)}}
  // marcador parado depois do bote
  for(const k of DEF()){const d=E[k];if(d.st==='stun'){const a=now/110;g.fillStyle='#f2b33d';g.fillRect(Math.round(d.x+Math.cos(a)*4),Math.round(d.y-18+Math.sin(a)*1.5),1,1);g.fillRect(Math.round(d.x-Math.cos(a)*4),Math.round(d.y-18-Math.sin(a)*1.5),1,1)}}
  // contagem para recuperar a bola
  if(phase==='lost'&&E[ball.owner]){const d=E[ball.owner];g.strokeStyle='#f2b33d';g.lineWidth=2;g.beginPath();g.arc(Math.round(d.x),Math.round(d.y)-24,4,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.max(0,lostT/L().lostT));g.stroke();
   g.lineWidth=1;g.beginPath();g.ellipse(Math.round(d.x)+.5,Math.round(d.y)+1.5,8,3,0,0,Math.PI*2);g.stroke()}
 }
 for(const p of parts){g.fillStyle=p.c;g.fillRect(Math.round(p.x),Math.round(p.y),2,3)}
 if(replay){g.fillStyle='#000';g.fillRect(0,0,W,16);g.fillRect(0,H-16,W,16);if(blink){g.fillStyle='#e0413a';g.fillRect(10,5,6,6)}g.fillStyle='#fff';g.font='8px monospace';g.textBaseline='top';g.fillText('REPLAY',20,4)}
 if(fx.flash>0){g.globalAlpha=fx.flash*.6;g.fillStyle=fx.flashC;g.fillRect(0,0,W,H);g.globalAlpha=1}
 if(fx.rew>0){for(let i=0;i<8;i++){const y=Math.random()*H|0,h=4+Math.random()*10|0;g.drawImage(cv,0,y,W,h,(Math.random()-.5)*20,y,W,h)}g.globalAlpha=.25;g.fillStyle='#d8f55a';g.fillRect(0,0,W,H);g.globalAlpha=1}
 g.restore();
}

/* ================= LOOP ================= */
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();hud();requestAnimationFrame(frame)}
lv=clamp((store.get()||{}).lv||0,0,LAST);setupPlay();renderStory();layout();renderOverlay();
const h=location.hash.slice(1);if(/^[1-6]$/.test(h))jump(+h-1);
requestAnimationFrame(frame);
</script>
